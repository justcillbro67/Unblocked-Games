<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1210" />
      <stop offset="100%" stop-color="#163225" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect x="80" y="80" width="1040" height="470" rx="28" fill="#0f1e18" stroke="#2c5a45" stroke-width="2" />
  <g filter="url(#glow)">
    <path d="M260 370 C 330 310, 400 310, 470 370 S 610 430, 680 370 820 310 900 370" fill="none" stroke="#64f58d" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="245" cy="380" r="18" fill="#64f58d" />
    <circle cx="910" cy="370" r="10" fill="#64f58d" />
  </g>
  <text x="120" y="210" fill="#dfffe9" font-family="'Segoe UI', Arial, sans-serif" font-size="64" font-weight="700">Snake</text>
  <text x="120" y="270" fill="#8fd8b1" font-family="'Segoe UI', Arial, sans-serif" font-size="26">Classic grid movement and growth.</text>
</svg>
