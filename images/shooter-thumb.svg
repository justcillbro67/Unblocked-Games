<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0c0f1a" />
      <stop offset="100%" stop-color="#1b1230" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect x="80" y="80" width="1040" height="470" rx="28" fill="#141427" stroke="#3b2b6e" stroke-width="2" />
  <g filter="url(#glow)">
    <polygon points="280,390 360,360 360,420" fill="#8db6ff" />
    <rect x="360" y="385" width="420" height="10" fill="#8db6ff" />
    <circle cx="800" cy="390" r="22" fill="#ff7bd3" />
    <circle cx="860" cy="360" r="12" fill="#ff7bd3" />
    <circle cx="900" cy="430" r="16" fill="#ff7bd3" />
  </g>
  <text x="120" y="210" fill="#e8e4ff" font-family="'Segoe UI', Arial, sans-serif" font-size="64" font-weight="700">Shooter</text>
  <text x="120" y="270" fill="#b9a8ff" font-family="'Segoe UI', Arial, sans-serif" font-size="26">Fast reactions and target control.</text>
</svg>
